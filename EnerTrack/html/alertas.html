﻿<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Alertas – EnerTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <link rel="stylesheet" href="../css/alertas.css">
</head>
<body>
<div class="app-container">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../assets/logo.svg" alt="EnerTrack" style="width:100%;height:100%;object-fit:contain;">
            </div>
            <div class="sidebar-title">
                <h2>EnerTrack</h2>
                <p id="sidebarSubtitle">Panel</p>
            </div>
        </div>

        <!-- El nav se construye dinámicamente por buildSidebar() en auth.js -->
        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-details">
                    <h4 id="userName"></h4>
                    <p id="userRole"></p>
                </div>
            </div>
            <button class="btn-logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                    <h1>Centro de Alertas</h1>
                    <p>Notificaciones y avisos del sistema</p>
                </div>
            </div>
            <div class="navbar-right">
                <button class="btn btn-secondary" id="markAllRead">
                    <i class="fas fa-check-double"></i><span>Marcar todas leídas</span>
                </button>
                <div class="notif-wrapper">
                    <button class="notif-btn" id="notifBtn" aria-label="Notificaciones">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notifBadge">3</span>
                    </button>
                    <div class="notif-panel" id="notifPanel"></div>
                </div>
                <div class="navbar-user">
                    <div class="user-avatar-sm" id="navAvatar"></div>
                    <span id="navUserName"></span>
                </div>
            </div>
        </nav>

        <div class="page-content">

            <div class="cards-grid">
                <div class="card card-red">
                    <div class="card-header">
                        <span class="card-title">Alertas Activas</span>
                        <div class="card-icon"><i class="fas fa-exclamation-circle"></i></div>
                    </div>
                    <div class="card-value" id="activeAlerts">3</div>
                    <div class="card-label">Requieren atención</div>
                </div>
                <div class="card card-red">
                    <div class="card-header">
                        <span class="card-title">Críticas</span>
                        <div class="card-icon"><i class="fas fa-exclamation-triangle"></i></div>
                    </div>
                    <div class="card-value" id="criticalAlerts">1</div>
                    <div class="card-label">Alta prioridad</div>
                </div>
                <div class="card card-yellow">
                    <div class="card-header">
                        <span class="card-title">Advertencias</span>
                        <div class="card-icon"><i class="fas fa-exclamation"></i></div>
                    </div>
                    <div class="card-value" id="warningAlerts">2</div>
                    <div class="card-label">Media prioridad</div>
                </div>
                <div class="card card-blue">
                    <div class="card-header">
                        <span class="card-title">Informativas</span>
                        <div class="card-icon"><i class="fas fa-info-circle"></i></div>
                    </div>
                    <div class="card-value" id="infoAlerts">2</div>
                    <div class="card-label">Baja prioridad</div>
                </div>
            </div>

            <div class="alerts-filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i><span>Todas</span>
                </button>
                <button class="filter-btn" data-filter="critical">
                    <i class="fas fa-exclamation-circle"></i><span>Críticas</span>
                </button>
                <button class="filter-btn" data-filter="warning">
                    <i class="fas fa-exclamation-triangle"></i><span>Advertencias</span>
                </button>
                <button class="filter-btn" data-filter="info">
                    <i class="fas fa-info-circle"></i><span>Informativas</span>
                </button>
            </div>

            <div class="alerts-container" id="alertsContainer"></div>

        </div>
    </main>
</div>

<button class="scroll-top" id="scrollTop" aria-label="Volver arriba">
    <i class="fas fa-chevron-up"></i>
</button>

<script src="../js/auth.js"></script>
<script src="../js/data.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/alertas.js"></script>
</body>
</html>
