﻿<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../favicon.svg">
    <title>Recomendaciones – EnerTrack</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/notifications.css">
    <link rel="stylesheet" href="../css/recomendaciones.css">
</head>
<body>
<div class="app-container">

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../assets/logo.svg" alt="EnerTrack" style="width:100%;height:100%;object-fit:contain;">
            </div>
            <div class="sidebar-title">
                <h2>EnerTrack</h2>
                <p id="sidebarSubtitle">Panel</p>
            </div>
        </div>

        <nav class="sidebar-nav" id="sidebarNav"></nav>

        <div class="sidebar-footer">
            <div class="user-info">
                <div class="user-avatar" id="userAvatar"></div>
                <div class="user-details">
                    <h4 id="userName"></h4>
                    <p id="userRole"></p>
                </div>
            </div>
            <button class="btn-logout" id="logoutBtn">
                <i class="fas fa-sign-out-alt"></i><span>Cerrar Sesión</span>
            </button>
        </div>
    </aside>

    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <main class="main-content">
        <nav class="navbar">
            <div class="navbar-left">
                <button class="menu-toggle" id="menuToggle" aria-label="Abrir menú">
                    <i class="fas fa-bars"></i>
                </button>
                <div>
                    <h1>Recomendaciones Inteligentes</h1>
                    <p>Consejos personalizados para optimizar tu consumo</p>
                </div>
            </div>
            <div class="navbar-right">
                <div class="notif-wrapper">
                    <button class="notif-btn" id="notifBtn" aria-label="Notificaciones">
                        <i class="fas fa-bell"></i>
                        <span class="notif-badge" id="notifBadge">3</span>
                    </button>
                    <div class="notif-panel" id="notifPanel"></div>
                </div>
                <div class="navbar-user">
                    <div class="user-avatar-sm" id="navAvatar"></div>
                    <span id="navUserName"></span>
                </div>
            </div>
        </nav>

        <div class="page-content">

            <div class="cards-grid">
                <div class="card card-green">
                    <div class="card-header">
                        <span class="card-title">Ahorro Potencial</span>
                        <div class="card-icon"><i class="fas fa-piggy-bank"></i></div>
                    </div>
                    <div class="card-value">231 kWh</div>
                    <div class="card-label">Por mes si aplicas todo</div>
                </div>
                <div class="card card-blue">
                    <div class="card-header">
                        <span class="card-title">Recomendaciones</span>
                        <div class="card-icon"><i class="fas fa-lightbulb"></i></div>
                    </div>
                    <div class="card-value">5</div>
                    <div class="card-label">Activas para ti</div>
                </div>
                <div class="card card-red">
                    <div class="card-header">
                        <span class="card-title">Alto Impacto</span>
                        <div class="card-icon"><i class="fas fa-star"></i></div>
                    </div>
                    <div class="card-value">2</div>
                    <div class="card-label">Prioritarias</div>
                </div>
                <div class="card card-green">
                    <div class="card-header">
                        <span class="card-title">Aplicadas</span>
                        <div class="card-icon"><i class="fas fa-check-circle"></i></div>
                    </div>
                    <div class="card-value">8</div>
                    <div class="card-label">Este mes</div>
                </div>
            </div>

            <div class="recommendations-filters">
                <button class="filter-btn active" data-filter="all">
                    <i class="fas fa-th"></i><span>Todas</span>
                </button>
                <button class="filter-btn" data-filter="high">
                    <i class="fas fa-arrow-up"></i><span>Alto Impacto</span>
                </button>
                <button class="filter-btn" data-filter="medium">
                    <i class="fas fa-minus"></i><span>Medio Impacto</span>
                </button>
                <button class="filter-btn" data-filter="low">
                    <i class="fas fa-arrow-down"></i><span>Bajo Impacto</span>
                </button>
            </div>

            <div class="recommendations-container" id="recommendationsContainer"></div>

        </div>
    </main>
</div>

<button class="scroll-top" id="scrollTop" aria-label="Volver arriba">
    <i class="fas fa-chevron-up"></i>
</button>

<script src="../js/auth.js"></script>
<script src="../js/data.js"></script>
<script src="../js/notifications.js"></script>
<script src="../js/recomendaciones.js"></script>
</body>
</html>
